packages:
  - 'apps/*'
  - 'packages/*'
  - 'contracts'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  '@nestjs/core': true
  keccak: true
  secp256k1: true
  bufferutil: true
  utf-8-validate: true
  '@parcel/watcher': true

# pnpm 10 (dipakai Vercel) memakai onlyBuiltDependencies
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - esbuild
  - keccak
  - secp256k1

# pnpm audit (CI Security): pengecualian yang sudah dinilai — lihat docs/INFRA_SECURITY.md.
auditConfig:
  ignoreGhsas:
    # deepmerge-ts <8 via prisma → @prisma/config: hanya dipakai CLI Prisma saat build/migrate,
    # tidak memproses input pengguna di runtime. Hapus setelah Prisma memperbarui dependensinya.
    - GHSA-ggr8-5vv4-36mx
